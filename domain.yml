version: "3.1"

intents:
  - saudacao
  - meu_nome
  - recomendacoes
  - afirmacao
  - agradecimento
  - Empregada_Freida_McFadden
  - Tudo_Rio_Carla_Madeira
  - Biblioteca_Meia_Noite_Matt_Haig
