  - text: "Acredito que esteja falando do livro A Paciente Silenciosa do Alex Michaelides"

  utter_Jantar_Secreto_Raphael_Montes:
  - text: "Acredito que esteja falando do livro Jantar Secreto do Raphael Montes"

  utter_Cabeca_Santo_Socorro_Acioli:
  - text: "Acredito que esteja falando do livro A Cabeça da Santo de Socorro Acioli"

  utter_Homem_Giz_CJ_Tudor:
  - text: "Acredito que esteja falando do livro O Homem de Giz do C.J. Tudor"

  utter_Conto_Aia_Margaret_Atwood:
