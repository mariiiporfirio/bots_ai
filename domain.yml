  - text: "Hum, acho que não conheço esse livro. Para mais recomendações você pode buscar no ChatGPT ou no Google."

  utter_afirmacao:
  - text: "Ajude em algo mais?"

  utter_agradecimento:
  - text: "Imagina, tenha um bom dia !"

  utter_Empregada_Freida_McFadden:
  - text: "Acredito que esteja falando do livro A Empregada de Freida McFadden."

  utter_Tudo_Rio_Carla_Madeira:
